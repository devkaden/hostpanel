      <stop offset="0" stop-color="#5b9cff"/>
      <stop offset="1" stop-color="#3a63e0"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#hp-bg-w)"/>
  <rect x="15" y="16" width="34" height="9" rx="3" fill="#fff"/>
  <rect x="15" y="28" width="34" height="9" rx="3" fill="#fff" opacity=".72"/>
  <rect x="15" y="40" width="34" height="9" rx="3" fill="#fff" opacity=".45"/>
  <circle cx="21.5" cy="20.5" r="2.1" fill="#3a63e0"/>

  <!-- currentColor so the wordmark works on a light or a dark README. -->
